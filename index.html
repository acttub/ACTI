<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- ── 인스타 인앱 브라우저에서 빠져나오기 ──
         인스타 캡션·DM·공유 링크로 이 주소에 바로 들어오면 인스타 안에 갇힌 웹뷰로 열린다.

         안드로이드: intent 스킴으로 기본 브라우저를 부른다. 크롬을 package로 못박지 않는다 —
           못박으면 크롬이 없는 기기(삼성 인터넷만 쓰는 갤럭시)에서 실패하고,
           그때 쓰는 S.browser_fallback_url은 안드로이드 시스템이 아니라 intent를 해석한 쪽이
           처리하는 관례라 인스타 웹뷰가 구현하지 않았으면 에러 화면으로 끝난다.
           package를 빼면 기본 브라우저는 항상 존재하므로 그 실패 경로 자체가 없어진다.
           기본 브라우저가 크롬인 기기가 대부분이라 실제로도 크롬이 뜬다.

         iOS: 방법이 없다. 브라우저 종류의 문제가 아니라 WKWebView가 커스텀 스킴을 호스트 앱에
           넘기지 않아서다 — 사파리든 크롬이든 웨일이든 똑같이 막힌다.
           x-safari-https도 instagram://extbrowser도 인스타가 막았다(2026-08-10 재확인).
           인앱 우측 상단 ··· 메뉴에서 사용자가 직접 여는 길밖에 없다.

         자동 전환은 보장되지 않는다. 파싱 중 실행되는 location.replace에는 사용자 제스처가
         없어서 웹뷰가 intent 실행을 거부할 수 있다. link-hub에는 그때를 위해 누를 수 있는
         배너 버튼이 따로 있지만(탭에는 제스처가 붙는다) 그 스타일이 link-hub 전용이라
         여기엔 자동 전환만 가져왔다 — 전환이 실패하면 인앱에 그대로 남는다.

         정본은 acttub/link-hub의 index.html이다. 고칠 일이 생기면 거기서 고치고 여기로 옮긴다.
         ⚠️ 이 블록만 지우면 원래 동작으로 완전히 되돌아간다. -->
    <script>
    (function () {
      var ua = navigator.userAgent || "";

      // 메타 계열 인앱 웹뷰만 본다. 카카오·네이버 인앱은 건드리지 않는다 —
      // 인스타 유입만 대상이고, 다른 인앱에서 intent 전환이 어떻게 도는지는 확인한 적이 없다.
      if (!/Instagram|FBAN|FBAV|FB_IAB|Threads/i.test(ua)) return;

      var android = /Android/i.test(ua);

      if (!android) return;

      // 프래그먼트는 떼어낸다 — intent 문법에서 #이 구분자라 그대로 넣으면 주소가 깨진다.
      // UTM을 포함한 쿼리는 그대로 넘어간다.
      var intent = "intent://" + location.href.split("#")[0].replace(/^https?:\/\//, "") +
                   "#Intent;scheme=https;end";

      // ib=1은 자동 전환을 끄는 스위치다. 손으로 확인할 때 쓴다(?ib=1을 붙여서 연다).
      // 값이 %69b 처럼 인코딩돼 들어와도 같게 읽히도록 문자열이 아니라 파라미터로 판정한다.
      try {
        if (new URLSearchParams(location.search).get("ib") === "1") return;
      } catch (e) {
        if (/[?&]ib=1(&|$)/.test(location.search)) return;   // URLSearchParams가 없는 낡은 웹뷰
      }

      // 자동화 브라우저에서는 전환하지 않는다. tools/device-matrix.py의 insta-inapp-android
      // 프리셋이 인스타 UA로 도는데, 여기서 페이지를 떠나면 하네스가 레이아웃을 잴 대상을 잃는다.
      // 진짜 사용자 브라우저에서는 이 값이 서지 않는다.
      if (navigator.webdriver) return;

      location.replace(intent);
    })();
    </script>
    <meta name="theme-color" content="#FAFAF8" />

    <!-- 기본 메타. 결과 페이지(/result/:code)는 빌드 후 scripts/prerender-og.mjs 가
         이 블록을 유형별 값으로 갈아끼운다. 마커를 지우면 프리렌더가 실패한다. -->
    <!-- OG:START -->
    <title>연기 스타일 MBTI — ACTI</title>
    <meta name="description" content="약 2~3분 · 14문항. 연영과·배우를 위한 연기 캐릭터 찾기." />
    <meta property="og:title" content="연기 스타일 MBTI — ACTI" />
    <meta property="og:description" content="약 2~3분 · 14문항. 연영과·배우를 위한 연기 캐릭터 찾기." />
    <meta property="og:image" content="https://acti.acttub.com/og/landing.jpg" />
    <meta property="og:url" content="https://acti.acttub.com/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- OG:END -->

    <!-- Pretendard Variable -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"
    />

    <!-- Playfair Display (워터마크 이탤릭 세리프) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500;1,600&display=swap"
    />

    <!-- Kakao JS SDK v2 -->
    <script
      src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js"
      integrity="sha384-DKYJZ8NLiK8MN4/C5P2dtSmLQ4KwPaoqAfyA/DfmEc1VDxu4yyC7wy6K1Hs90nka"
      crossorigin="anonymous"
    ></script>

    <!-- 모바일 디버그 콘솔 (URL 끝에 ?debug=1 붙이면 켜짐) -->
    <script>
      (function () {
        try {
          if (location.search.indexOf('debug=1') !== -1) {
            var s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/eruda';
            s.onload = function () { window.eruda && window.eruda.init(); };
            document.head.appendChild(s);
          }
        } catch (e) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Vercel Web Analytics (쿠키리스). 유입처를 보기 위한 것이다 —
         link.acttub.com에서 몇 명이 넘어왔는지를 Referrers에서 확인한다.
         첫 진입만 집계된다(SPA 라우트 이동은 세지 않는다). 유입 측정엔 그걸로 충분하다. -->
    <script defer src="/_vercel/insights/script.js"></script>
  </body>
</html>
